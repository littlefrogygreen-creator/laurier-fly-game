<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b9ecff">
<title>Laurier KAO LSSG New Package 遊戲大廳</title>
<meta name="description" content="Laurier 零感特薄新包裝小遊戲：飛飛挑戰、消消樂、層層疊。揀一款即玩，挑戰十大排行榜！">
<meta property="og:title" content="Laurier KAO LSSG New Package 遊戲大廳">
<meta property="og:description" content="三款 Laurier 零感特薄新包裝小遊戲，揀一款即玩，挑戰十大排行榜！">
<meta property="og:image" content="shared/assets/new1.png?v=3">
<link rel="icon" href="shared/assets/leaf.png?v=3">
<link rel="apple-touch-icon" href="shared/assets/leaf.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+HK:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/common.css?v=3">
<link rel="stylesheet" href="hub.css?v=4">
</head>
<body class="hub">
<div class="bubbles" aria-hidden="true"></div>
<button class="icon-btn" id="mute" type="button">🎵</button>

<main class="lobby">
  <header class="hero">
    <img class="logo" src="shared/assets/logo.png?v=3" alt="Laurier">
    <h1 class="title">Laurier KAO<br>LSSG New Package<small>零感特薄 · 全新包裝登場</small></h1>
    <div class="hero-packs" aria-hidden="true">
      <img class="hp hp-day" src="shared/assets/new1.png?v=3" alt="">
      <img class="hp hp-night" src="shared/assets/new2.png?v=3" alt="">
    </div>
    <ul class="chips" aria-label="產品特點">
      <li><b>0.1</b>cm 超薄</li>
      <li><b>1</b>秒瞬吸</li>
      <li>日用 · 夜用</li>
    </ul>
  </header>

  <section aria-labelledby="pickTitle">
    <h2 class="sec-title" id="pickTitle">揀一款遊戲</h2>
    <div class="games">
      <a class="game-card g-fly" href="fly/">
        <div class="art" aria-hidden="true">
          <span class="wing"></span>
          <img src="shared/assets/new1.png?v=3" alt="">
        </div>
        <div class="info">
          <h3>飛飛挑戰</h3>
          <p>撳屏幕令新包裝飛高，避開障礙物</p>
          <span class="best" data-best="laurier_fly_best"></span>
        </div>
        <span class="go">玩</span>
      </a>
      <a class="game-card g-match" href="match/">
        <div class="art" aria-hidden="true">
          <div class="mini-grid">
            <img src="shared/assets/new1.png?v=3" alt=""><img src="shared/assets/new1.png?v=3" alt=""><img src="shared/assets/new1.png?v=3" alt="">
            <img src="shared/assets/old1.png?v=3" alt=""><img src="shared/assets/new2.png?v=3" alt=""><img src="shared/assets/kao.png?v=3" alt="">
          </div>
        </div>
        <div class="info">
          <h3>消消樂</h3>
          <p>三個相同圖案連線，60 秒鬥高分</p>
          <span class="best" data-best="laurier_match_best"></span>
        </div>
        <span class="go">玩</span>
      </a>
      <a class="game-card g-stack" href="stack/">
        <div class="art" aria-hidden="true">
          <img class="s3" src="shared/assets/new1.png?v=3" alt="">
          <img class="s2" src="shared/assets/new2.png?v=3" alt="">
          <img class="s1" src="shared/assets/new1.png?v=3" alt="">
        </div>
        <div class="info">
          <h3>層層疊</h3>
          <p>睇準時機放低，將新包裝疊上天</p>
          <span class="best" data-best="laurier_stack_best"></span>
        </div>
        <span class="go">玩</span>
      </a>
    </div>
  </section>

  <section class="board-sec" aria-labelledby="lbTitle">
    <h2 class="sec-title" id="lbTitle">🏆 十大排行榜</h2>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" class="tab on" data-game="fly" aria-selected="true">飛飛挑戰</button>
      <button type="button" role="tab" class="tab" data-game="match" aria-selected="false">消消樂</button>
      <button type="button" role="tab" class="tab" data-game="stack" aria-selected="false">層層疊</button>
    </div>
    <div class="card board-card">
      <ol class="lb" id="lbList"></ol>
      <p class="lb-note" id="lbNote"></p>
    </div>
  </section>

  <footer class="foot">玩完一局留低暱稱同手機號碼，就可以上榜。<br>手機號碼唔會公開，只用嚟聯絡得獎者。</footer>
</main>

<script src="shared/config.js?v=4"></script>
<script src="shared/common.js?v=3"></script>
<script src="hub.js?v=3"></script>
</body>
</html>
